<svg viewBox="0 0 420 730" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" width="420" height="730">
  <title id="title">GLM 5.4 looped architecture</title>
  <desc id="desc">Read bottom to top. 26 prelude layers run once, layers 27 through 54 run twice with shared weights and gated progressive updates, then 24 coda layers run once. This gives 106 layer passes from 78 stored layers.</desc>
  <!-- Visual language adapted from arjun kocher, https://www.k-a.in/loop-transformer.html (CC BY 4.0). Redrawn for this repository. -->
  <defs>
    <pattern id="dots" width="29" height="29" patternUnits="userSpaceOnUse"><path d="M29 0H0V29" fill="none" stroke="#cbd5e1" stroke-width=".7" opacity=".55"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#344054"/></marker>
    <marker id="arrowHot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6d4bd0"/></marker>
  </defs>
  <style>
    text{font-family:"IBM Plex Sans","Avenir Next","Trebuchet MS",Arial,sans-serif;fill:#24324a;text-anchor:middle}
    .box{fill:#ffffff;stroke:#a6b3c5;stroke-width:2}.panel{fill:#edf1f7;stroke:#98a5b8;stroke-width:2}
    .norm{fill:#e2f2f7;stroke:#7bb8c7;stroke-width:2}.loop{fill:#e9e7ff;stroke:#a99eea;stroke-width:2}
    .conn{fill:none;stroke:#344054;stroke-width:2;marker-end:url(#arrow)}
    .back{fill:none;stroke:#6d4bd0;stroke-width:2.4;stroke-dasharray:8 6;marker-end:url(#arrowHot)}
    .label{font-size:16px}.small{font-size:12.5px;fill:#667085}.italic{font-style:italic}.bold{font-weight:600}.hot{fill:#6d4bd0}
  </style>
  <rect width="420" height="730" fill="#f5f7fb"/><rect width="420" height="730" fill="url(#dots)"/>
  <text x="170" y="27" class="label italic">next-token logits</text>
  <path class="conn" d="M170 52V38"/>
  <rect class="box" x="80" y="52" width="180" height="34" rx="5"/><text x="170" y="74" class="label">norm → lm_head</text>
  <path class="conn" d="M170 168V88"/>
  <rect class="panel" x="65" y="168" width="210" height="58" rx="10"/>
  <text x="170" y="192" class="label bold">Coda · L55–L78</text><text x="170" y="213" class="small italic">24 layers · run once</text>
  <path class="conn" d="M170 270V228"/>
  <rect class="panel" x="55" y="270" width="230" height="220" rx="12"/>
  <text x="170" y="299" class="label bold">Shared · L27–L54</text>
  <text x="170" y="321" class="small italic">28 layers · same weights</text>
  <rect class="loop" x="90" y="346" width="160" height="46" rx="6"/><text x="170" y="366" class="label">pass 1</text><text x="170" y="384" class="small">conservative write</text>
  <rect class="loop" x="90" y="418" width="160" height="46" rx="6"/><text x="170" y="438" class="label">pass 2</text><text x="170" y="456" class="small">progressive update</text>
  <text x="36" y="387" class="label italic hot" transform="rotate(-90 36 387)">2 passes</text>
  <path class="conn" d="M170 538V492"/>
  <path class="back" d="M170 270H354V490H172"/>
  <circle cx="354" cy="380" r="18" fill="#e2f2f7" stroke="#7bb8c7" stroke-width="2"/>
  <text x="354" y="387" font-size="20" font-style="italic">β</text>
  <text x="354" y="422" class="small italic hot">per-token gates</text>
  <text x="354" y="440" class="small italic hot">+ shared sparse KV</text>
  <rect class="panel" x="65" y="538" width="210" height="56" rx="10"/>
  <text x="170" y="561" class="label bold">Prelude · L1–L26</text><text x="170" y="582" class="small italic">26 layers · run once</text>
  <path class="conn" d="M170 632V596"/>
  <rect class="box" x="95" y="632" width="150" height="30" rx="5"/><text x="170" y="652" class="label">Embedding</text>
  <path class="conn" d="M170 694V664"/>
  <text x="170" y="716" class="label italic">input tokens</text>
</svg>
